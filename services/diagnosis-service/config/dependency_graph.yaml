# Sock Shop service dependency graph, transcribed from CONTRACTS.md ("Service dependency
# graph"), where M1 confirmed each edge from the images' own config (docs/phase0-decisions.md).
# Do not add an edge that isn't in the contract; change the contract first.
#
# Edges are [caller, callee]. shipping -> rabbitmq <- queue-master is an async fan-out through
# a message queue, separate from the REST chain; it is traversed like any other edge.

nodes:
  edge-router: gateway      # Traefik, single entrypoint
  front-end: service        # Node.js BFF
  catalogue: service
  catalogue-db: datastore   # MySQL
  carts: service
  carts-db: datastore       # Mongo
  orders: service
  orders-db: datastore      # Mongo
  payment: service
  shipping: service
  user: service
  user-db: datastore        # Mongo
  rabbitmq: broker
  queue-master: service
  stream-web: service       # dummy streaming site, no edge to Sock Shop
  stream-catalog: service
  stream-playback: service
  stream-cache: service
  stream-storage: service
  ci-web: service           # dummy CI/CD site, no edge to Sock Shop
  ci-pipeline: service
  ci-scheduler: service
  ci-runner: service
  ci-artifacts: service
  ci-deployer: service

edges:
  - [edge-router, front-end]
  - [front-end, catalogue]
  - [front-end, carts]
  - [front-end, orders]
  - [front-end, user]
  - [catalogue, catalogue-db]
  - [carts, carts-db]
  - [orders, orders-db]
  - [orders, payment]
  - [orders, shipping]
  - [orders, user]
  - [user, user-db]
  - [shipping, rabbitmq]
  - [queue-master, rabbitmq]
  - [stream-web, stream-catalog]
  - [stream-web, stream-playback]
  - [stream-playback, stream-cache]
  - [stream-cache, stream-storage]
  - [ci-web, ci-pipeline]
  - [ci-pipeline, ci-scheduler]
  - [ci-pipeline, ci-artifacts]
  - [ci-scheduler, ci-runner]
  - [ci-artifacts, ci-deployer]
