server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy so src/api.ts never needs CORS or a hardcoded orchestrator host --
    # the browser only ever talks to this container. The trailing slash on proxy_pass strips
    # the /api/ prefix before forwarding to the orchestrator.
    location /api/ {
        proxy_pass http://orchestrator:8090/;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://orchestrator:8090/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
