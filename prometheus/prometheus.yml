global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Every Sock Shop app service ships pre-instrumented with a native
  # Prometheus /metrics endpoint (request_duration_seconds histogram with
  # method/route/status_code labels, CPU, memory) - verified by curling
  # each service directly. No sidecar/agent instrumentation needed here.
  #
  # queue-master is deliberately excluded: its /metrics returns legacy
  # Spring Boot Actuator JSON, not Prometheus text format (a real
  # inconsistency in that image vs. carts/orders/shipping), which breaks
  # the scrape. Documented as a known gap rather than faked - see
  # docs/phase0-decisions.md.
  - job_name: sock-shop-services
    scrape_interval: 5s
    static_configs:
      - targets:
          - front-end:8079
          - catalogue:80
          - payment:80
          - user:80
          - carts:80
          - orders:80
          - shipping:80
        labels:
          project: incident-diagnosis-system

  # Testbed state, not a service under test: the size of orders-db's order
  # history and how fast the load generator prunes it (issue #33). A separate
  # job so metrics-bridge can tell it apart - its per-service loop only reads
  # sock-shop-services, and publishes these under `orders-db` instead.
  - job_name: testbed-state
    scrape_interval: 5s
    static_configs:
      - targets:
          - load-generator:5002
        labels:
          project: incident-diagnosis-system

  # Dummy site for testing detection on something other than Sock Shop. Reported
  # as down whenever its Compose profile is off; metrics-bridge only reads
  # targets that are up, so that is harmless.
  - job_name: streaming-site
    scrape_interval: 5s
    static_configs:
      - targets:
          - stream-web:8080
          - stream-catalog:8080
          - stream-playback:8080
          - stream-cache:8080
          - stream-storage:8080
        labels:
          project: incident-diagnosis-system

  - job_name: cicd-site
    scrape_interval: 5s
    static_configs:
      - targets:
          - ci-web:8080
          - ci-pipeline:8080
          - ci-scheduler:8080
          - ci-runner:8080
          - ci-artifacts:8080
          - ci-deployer:8080
        labels:
          project: incident-diagnosis-system
